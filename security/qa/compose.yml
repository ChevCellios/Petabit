# Private lab. No egress, public domain, credentials, or production volume.
# Start: docker compose -f security/qa/compose.yml up -d --build
# Target: http://petabit-qa:3000/ from the private lab network.
services:
  petabit-qa:
    image: node@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    command: ["node", "/lab/proxy.mjs"]
    volumes:
      - ./:/lab:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      lab:
        ipv4_address: 172.30.251.3
  petabit-qa-app:
    build:
      context: ../..
      dockerfile: Petabit/Dockerfile
    environment:
      PORT: "3000"
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: petabit-qa
      StationSync__Enabled: "false"
      ForwardedHeaders__KnownProxies__0: 172.30.251.3
    read_only: true
    tmpfs:
      - /tmp:uid=1654,gid=1654,mode=700
      - /app/App_Data:uid=1654,gid=1654,mode=700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [lab]
networks:
  lab:
    name: petabit-security-lab
    internal: true
    ipam:
      config:
        - subnet: 172.30.251.0/24
