version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/security/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zagreb"
    open-pull-requests-limit: 5
    groups:
      nuget-patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Zagreb"
    open-pull-requests-limit: 5
    groups:
      github-actions-patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"

  - package-ecosystem: "docker"
    directory: "/Petabit"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
