name: Station Status Freshness

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-station-status:
    name: Verify live NASA synchronization
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production station status
        env:
          SITE_URL: https://petabit-production.up.railway.app
        run: |
          curl --fail --silent --show-error --connect-timeout 5 --max-time 20 \
            "$SITE_URL/Home/StationData" |
            jq --exit-status '
              .stationStatusCheckedAt != null and
              (.stationStatusIsStale == false) and
              (.stationStatusRefreshFailed == false) and
              (.stationStatusNeedsReview == false) and
              (.stationStatusPersistenceFailed == false) and
              (.astronautCount == (.astronauts | length)) and
              ((.dockedVehicles | length) > 0)
            '
