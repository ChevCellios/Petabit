name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Petabit.sln --configfile NuGet.Config

      - name: Build release
        run: dotnet build Petabit.sln --configuration Release --no-restore -p:UseAppHost=false

      - name: Run tests
        run: dotnet test Petabit.sln --configuration Release --no-build --verbosity normal

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test ISS video playback
        run: node --test Petabit.Tests/*.test.cjs Petabit.Tests/*.test.mjs

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --build-arg RAILWAY_GIT_COMMIT_SHA="${{ github.sha }}" --file Petabit/Dockerfile --tag petabit:ci .

      - name: Verify commit embedded in Docker image
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          container="$(docker run --detach --publish 127.0.0.1:8080:3000 --env StationSync__Enabled=false petabit:ci)"
          trap 'docker rm --force "$container" > /dev/null' EXIT
          for attempt in $(seq 1 15); do
            response="$(curl --fail --silent --connect-timeout 2 --max-time 3 http://127.0.0.1:8080/version || true)"
            if jq --exit-status --arg sha "$EXPECTED_SHA" '.commitSha == $sha' <<< "$response" > /dev/null 2>&1; then
              echo "Docker image reports the expected build commit."
              exit 0
            fi
            sleep 2
          done
          echo "Docker image did not report the expected build commit."
          exit 1
